<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PocketSync</title>
    <style>
        :root {
            --bg: #f4f5f7; --card: #ffffff; --text: #1c1e21; --muted: #65676b;
            --accent: #2563eb; --accent-dark: #1d4ed8; --danger: #dc2626; --ok: #16a34a;
            --border: #e4e6eb;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #17181c; --card: #232530; --text: #e8e9ec; --muted: #9a9da5;
                --accent: #3b82f6; --accent-dark: #2563eb; --danger: #ef4444; --ok: #22c55e;
                --border: #33363f;
            }
        }
        * { box-sizing: border-box; margin: 0; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--bg); color: var(--text);
            max-width: 640px; margin: 0 auto; padding: 1rem;
        }
        h1 { font-size: 1.5rem; padding: .5rem 0 1rem; display: flex; align-items: center; gap: .5rem; }
        h1 .dot { width: .65rem; height: .65rem; border-radius: 50%; background: var(--ok); }
        h2 { font-size: 1.05rem; margin-bottom: .75rem; }
        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; padding: 1rem; margin-bottom: 1rem;
        }
        .drop {
            border: 2px dashed var(--border); border-radius: 10px;
            padding: 1.25rem; text-align: center; color: var(--muted);
            cursor: pointer; transition: border-color .15s, background .15s;
        }
        .drop.over { border-color: var(--accent); background: rgba(59,130,246,.08); }
        .drop input { display: none; }
        button {
            font: inherit; border: 0; border-radius: 8px; padding: .6rem 1rem;
            background: var(--accent); color: #fff; cursor: pointer;
        }
        button:active { background: var(--accent-dark); }
        button.ghost { background: transparent; color: var(--accent); }
        button.danger { background: var(--danger); }
        button:disabled { opacity: .5; cursor: default; }
        progress { width: 100%; height: .55rem; margin-top: .75rem; accent-color: var(--accent); }
        #status { margin-top: .5rem; font-size: .9rem; color: var(--muted); min-height: 1.2em; }
        ul { list-style: none; }
        li {
            display: flex; align-items: center; gap: .75rem;
            padding: .65rem .25rem; border-bottom: 1px solid var(--border);
        }
        li:last-child { border-bottom: 0; }
        li a.name {
            flex: 1; min-width: 0; color: var(--accent); text-decoration: none;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        li .meta { font-size: .8rem; color: var(--muted); white-space: nowrap; }
        li button { padding: .35rem .6rem; font-size: .85rem; }
        .row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
        .row.space { justify-content: space-between; }
        .power { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }
        .power button { background: var(--card); color: var(--text); border: 1px solid var(--border); }
        .power button.danger-outline { color: var(--danger); border-color: var(--danger); }
        #powerMsg { grid-column: 1 / -1; font-size: .9rem; color: var(--muted); min-height: 1.2em; }
        .empty { color: var(--muted); font-size: .9rem; padding: .5rem 0; }
    </style>
</head>
<body>
    <h1><span class="dot"></span>PocketSync</h1>

    <!-- ================= Trimite pe PC ================= -->
    <div class="card">
        <h2>Trimite pe PC</h2>
        <label class="drop" id="drop">
            Alege fișiere sau trage-le aici
            <input type="file" id="file" multiple>
        </label>
        <progress id="bar" value="0" max="100"></progress>
        <div id="status"></div>
    </div>

    <!-- ================= Fișiere pe PC ================= -->
    <div class="card">
        <div class="row space">
            <h2>Fișiere pe PC</h2>
            <button class="ghost" id="refresh">⟳ Reîmprospătează</button>
        </div>
        <ul id="list"></ul>
        <div class="empty" id="empty" hidden>Niciun fișier în folderul Storage.</div>
    </div>

    <!-- ================= Comenzi PC ================= -->
    <div class="card">
        <h2>Comenzi PC</h2>
        <div class="power">
            <button data-action="lock">🔒 Blochează</button>
            <button data-action="sleep">🌙 Sleep</button>
            <button data-action="restart" class="danger-outline">🔄 Restart</button>
            <button data-action="shutdown" class="danger-outline">⏻ Închide</button>
            <button data-action="abort" id="abort" hidden>✋ Anulează închiderea</button>
            <div id="powerMsg"></div>
        </div>
    </div>

    <script>
        const input = document.getElementById("file");
        const drop = document.getElementById("drop");
        const status = document.getElementById("status");
        const bar = document.getElementById("bar");
        const list = document.getElementById("list");
        const empty = document.getElementById("empty");
        const refresh = document.getElementById("refresh");
        const powerMsg = document.getElementById("powerMsg");
        const abortBtn = document.getElementById("abort");

        // ---------------- upload ----------------

        input.addEventListener("change", () => uploadAll(input.files));

        drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
        drop.addEventListener("dragleave", () => drop.classList.remove("over"));
        drop.addEventListener("drop", e => {
            e.preventDefault();
            drop.classList.remove("over");
            uploadAll(e.dataTransfer.files);
        });

        async function uploadAll(files) {
            if (!files || files.length === 0) return;
            for (let i = 0; i < files.length; i++) {
                const label = files.length > 1 ? ` (${i + 1}/${files.length})` : "";
                try {
                    await uploadOne(files[i], label);
                } catch (err) {
                    status.textContent = "Eroare la " + files[i].name + " : " + err;
                    return;
                }
            }
            status.textContent = files.length > 1
                ? "Gata — " + files.length + " fișiere trimise."
                : "Gata : " + files[0].name;
            bar.value = 0;
            input.value = "";
            loadFiles(); // lista se reîmprospătează automat după upload
        }

        function uploadOne(file, label) {
            return new Promise((resolve, reject) => {
                const fd = new FormData();
                fd.append("file", file);

                const xhr = new XMLHttpRequest();
                const start = Date.now();

                xhr.upload.addEventListener("progress", e => {
                    bar.value = (e.loaded / e.total) * 100;
                    const seconds = (Date.now() - start) / 1000;
                    const mbps = (e.loaded / 1024 / 1024) / seconds;
                    status.textContent = "Se trimite" + label + " " + file.name +
                        " — " + mbps.toFixed(1) + " MB/s";
                });

                xhr.addEventListener("load", () =>
                    xhr.status === 200 ? resolve() : reject("HTTP " + xhr.status));
                xhr.addEventListener("error", () => reject("rețea"));

                xhr.open("POST", "api/upload");
                xhr.send(fd);
            });
        }

        // ---------------- lista de fișiere ----------------

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + " B";
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
            if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + " MB";
            return (bytes / 1024 / 1024 / 1024).toFixed(2) + " GB";
        }

        function formatDate(utc) {
            const d = new Date(utc); // UTC pe sârmă, local la afișare
            return d.toLocaleDateString("ro-RO", { day: "numeric", month: "short" });
        }

        async function loadFiles() {
            const response = await fetch("api/files");
            if (!response.ok) return;
            const files = await response.json();

            list.innerHTML = "";
            empty.hidden = files.length > 0;

            for (const f of files) {
                const li = document.createElement("li");

                const a = document.createElement("a");
                a.className = "name";
                a.href = "api/files/" + f.id + "/download";
                a.textContent = f.name;

                const meta = document.createElement("span");
                meta.className = "meta";
                meta.textContent = formatSize(f.sizeBytes) + " · " + formatDate(f.modifiedUtc);

                const del = document.createElement("button");
                del.className = "danger";
                del.textContent = "✕";
                del.title = "Șterge (Recycle Bin)";
                del.addEventListener("click", async () => {
                    if (!confirm("Ștergi \"" + f.name + "\" de pe PC? (ajunge în Recycle Bin)")) return;
                    const r = await fetch("api/files/" + f.id, { method: "DELETE" });
                    if (r.ok) loadFiles();
                });

                li.appendChild(a);
                li.appendChild(meta);
                li.appendChild(del);
                list.appendChild(li);
            }
        }

        refresh.addEventListener("click", loadFiles);
        loadFiles();

        // ---------------- comenzi PC ----------------

        const confirmText = {
            shutdown: "Sigur închizi PC-ul?",
            restart: "Sigur repornești PC-ul?",
            sleep: "PC-ul intră în sleep. Continui?",
            lock: null, // lock e inofensiv, fără confirmare
            abort: null
        };

        document.querySelectorAll(".power button").forEach(b => {
            b.addEventListener("click", async () => {
                const action = b.dataset.action;
                const q = confirmText[action];
                if (q && !confirm(q)) return;

                const r = await fetch("api/power/" + action, { method: "POST" });
                const data = await r.json().catch(() => null);
                powerMsg.textContent = r.ok ? (data?.message ?? "OK") : "Eroare: HTTP " + r.status;

                // la shutdown/restart ai 15 secunde de răzgândit
                abortBtn.hidden = !(action === "shutdown" || action === "restart");
            });
        });
    </script>
</body>
</html>
