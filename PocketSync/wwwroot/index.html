<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>PocketSync</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        :root {
            --bg: #eef1f6; --card: #ffffff; --text: #16181d; --muted: #6b7280;
            --accent: #2563eb; --accent-soft: rgba(37, 99, 235, .10);
            --danger: #dc2626; --danger-soft: rgba(220, 38, 38, .08);
            --ok: #16a34a; --border: #e5e7eb;
            --shadow: 0 1px 3px rgba(16, 24, 40, .07), 0 8px 24px rgba(16, 24, 40, .05);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #101216; --card: #1b1e26; --text: #e9eaee; --muted: #9aa0ab;
                --accent: #4f8af8; --accent-soft: rgba(79, 138, 248, .14);
                --danger: #f05252; --danger-soft: rgba(240, 82, 82, .12);
                --ok: #2fbf62; --border: #2b2f3a;
                --shadow: 0 1px 3px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .3);
            }
        }
        * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
        html { overflow-x: hidden; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg); color: var(--text);
            max-width: 620px; margin: 0 auto;
            padding: max(1rem, env(safe-area-inset-top)) 1rem 2.5rem;
        }

        /* ---------- header ---------- */
        header { display: flex; align-items: center; gap: .65rem; padding: .5rem .25rem 1.1rem; }
        .logo {
            width: 2.2rem; height: 2.2rem; border-radius: .7rem; flex: none;
            box-shadow: var(--shadow);
        }
        header h1 { font-size: 1.25rem; letter-spacing: -.01em; }
        header .sub { font-size: .8rem; color: var(--muted); display: flex; align-items: center; gap: .35rem; }
        .dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--ok); flex: none; }

        /* ---------- carduri ---------- */
        .card {
            background: var(--card); border: 1px solid var(--border); border-radius: 16px;
            padding: 1.1rem; margin-bottom: 1rem; box-shadow: var(--shadow);
        }
        .card h2 {
            font-size: .8rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: .06em; color: var(--muted); margin-bottom: .85rem;
        }

        /* ---------- zona de upload ---------- */
        .drop {
            display: block;            /* label e inline by default — de aici venea suprapunerea */
            border: 2px dashed var(--border); border-radius: 12px;
            padding: 1.6rem 1rem; text-align: center; cursor: pointer;
            transition: border-color .15s, background .15s;
        }
        .drop:active, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
        .drop input { display: none; }
        .drop .icon {
            width: 2.4rem; height: 2.4rem; margin: 0 auto .6rem; border-radius: 50%;
            background: var(--accent-soft); color: var(--accent);
            display: grid; place-items: center;
        }
        .drop .icon svg { width: 1.2rem; height: 1.2rem; }
        .drop .title { font-weight: 600; font-size: .95rem; }
        .drop .hint { font-size: .8rem; color: var(--muted); margin-top: .25rem; }

        progress {
            width: 100%; height: .5rem; margin-top: .9rem; border: 0;
            border-radius: 99px; overflow: hidden; accent-color: var(--accent);
            display: none;
        }
        progress.on { display: block; }
        #status { margin-top: .55rem; font-size: .85rem; color: var(--muted); min-height: 1.2em; }
        #status.ok { color: var(--ok); }
        #status.err { color: var(--danger); }

        /* ---------- lista de fișiere ---------- */
        .row-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: .5rem; }
        .row-head h2 { margin-bottom: 0; }
        ul { list-style: none; }
        li { display: flex; align-items: center; gap: .8rem; padding: .7rem .2rem; }
        li + li { border-top: 1px solid var(--border); }
        .file-ico {
            width: 2.3rem; height: 2.3rem; border-radius: .6rem; flex: none;
            background: var(--accent-soft); color: var(--accent);
            display: grid; place-items: center; font-size: .62rem; font-weight: 700;
            letter-spacing: .02em; text-transform: uppercase;
        }
        li .info { flex: 1; min-width: 0; }
        li a.name {
            display: block; color: var(--text); text-decoration: none; font-weight: 500;
            font-size: .93rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        li .meta { font-size: .78rem; color: var(--muted); margin-top: .1rem; }
        .empty { color: var(--muted); font-size: .88rem; padding: .8rem 0; text-align: center; }

        /* ---------- butoane ---------- */
        button {
            font: inherit; border: 0; border-radius: 10px; cursor: pointer;
            padding: .55rem .9rem; background: var(--accent); color: #fff; font-weight: 500;
            transition: filter .1s, transform .05s;
        }
        button:active { transform: scale(.97); filter: brightness(.92); }
        button:disabled { opacity: .5; }
        .ghost { background: transparent; color: var(--accent); padding: .4rem .6rem; }
        .icon-btn {
            background: transparent; color: var(--muted); flex: none;
            width: 2.1rem; height: 2.1rem; padding: 0; border-radius: 50%;
            display: grid; place-items: center; font-size: 1rem;
        }
        .icon-btn:active { background: var(--danger-soft); color: var(--danger); }

        /* ---------- comenzi PC ---------- */
        .power { display: grid; grid-template-columns: 1fr 1fr; gap: .6rem; }
        .power button {
            background: var(--card); color: var(--text); border: 1px solid var(--border);
            padding: .8rem .5rem; font-weight: 500; font-size: .9rem;
        }
        .power button:active { background: var(--accent-soft); }
        .power .danger { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--border)); }
        .power .danger:active { background: var(--danger-soft); }
        #abort { grid-column: 1 / -1; background: var(--danger); color: #fff; border: 0; }
        #powerMsg { grid-column: 1 / -1; font-size: .85rem; color: var(--muted); min-height: 1.2em; }
    </style>
</head>
<body>
    <header>
        <img class="logo" src="apple-touch-icon.png" alt="">
        <div>
            <h1>PocketSync</h1>
            <div class="sub"><span class="dot"></span><span id="pcName">conectat</span></div>
        </div>
    </header>

    <!-- ================= Trimite pe PC ================= -->
    <div class="card">
        <h2>Trimite pe PC</h2>
        <label class="drop" id="drop">
            <span class="icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 19V6"/><path d="m5 12 7-7 7 7"/>
                </svg>
            </span>
            <span class="title">Alege fișiere</span>
            <span class="hint">sau trage-le aici de pe PC</span>
            <input type="file" id="file" multiple>
        </label>
        <progress id="bar" value="0" max="100"></progress>
        <div id="status"></div>
    </div>

    <!-- ================= Fișiere pe PC ================= -->
    <div class="card">
        <div class="row-head">
            <h2>Fișiere pe PC</h2>
            <button class="ghost" id="refresh">⟳ Reîmprospătează</button>
        </div>
        <ul id="list"></ul>
        <div class="empty" id="empty" hidden>Niciun fișier în folderul Storage.</div>
    </div>

    <!-- ================= Comenzi PC ================= -->
    <div class="card">
        <h2>Comenzi PC</h2>
        <div class="power">
            <button data-action="lock">🔒 Blochează</button>
            <button data-action="sleep">🌙 Sleep</button>
            <button data-action="restart" class="danger">🔄 Restart</button>
            <button data-action="shutdown" class="danger">⏻ Închide</button>
            <button data-action="abort" id="abort" hidden>✋ Anulează închiderea</button>
            <div id="powerMsg"></div>
        </div>
    </div>

    <script>
        const input = document.getElementById("file");
        const drop = document.getElementById("drop");
        const status = document.getElementById("status");
        const bar = document.getElementById("bar");
        const list = document.getElementById("list");
        const empty = document.getElementById("empty");
        const refresh = document.getElementById("refresh");
        const powerMsg = document.getElementById("powerMsg");
        const abortBtn = document.getElementById("abort");

        // numele PC-ului în header
        fetch("api/status").then(r => r.json())
            .then(s => document.getElementById("pcName").textContent = "conectat la " + s.name)
            .catch(() => {});

        // ---------------- upload ----------------

        input.addEventListener("change", () => uploadAll(input.files));

        drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
        drop.addEventListener("dragleave", () => drop.classList.remove("over"));
        drop.addEventListener("drop", e => {
            e.preventDefault();
            drop.classList.remove("over");
            uploadAll(e.dataTransfer.files);
        });

        function setStatus(text, cls) {
            status.textContent = text;
            status.className = cls || "";
        }

        async function uploadAll(files) {
            if (!files || files.length === 0) return;
            bar.classList.add("on");
            for (let i = 0; i < files.length; i++) {
                const label = files.length > 1 ? ` (${i + 1}/${files.length})` : "";
                try {
                    await uploadOne(files[i], label);
                } catch (err) {
                    setStatus("Eroare la " + files[i].name + " : " + err, "err");
                    bar.classList.remove("on");
                    return;
                }
            }
            setStatus(files.length > 1
                ? "Gata — " + files.length + " fișiere trimise ✓"
                : "Trimis: " + files[0].name + " ✓", "ok");
            bar.value = 0;
            bar.classList.remove("on");
            input.value = "";
            loadFiles(); // lista se reîmprospătează automat după upload
        }

        function uploadOne(file, label) {
            return new Promise((resolve, reject) => {
                const fd = new FormData();
                fd.append("file", file);

                const xhr = new XMLHttpRequest();
                const start = Date.now();

                xhr.upload.addEventListener("progress", e => {
                    bar.value = (e.loaded / e.total) * 100;
                    const seconds = (Date.now() - start) / 1000;
                    const mbps = (e.loaded / 1024 / 1024) / seconds;
                    setStatus("Se trimite" + label + " " + file.name +
                        " — " + mbps.toFixed(1) + " MB/s");
                });

                xhr.addEventListener("load", () =>
                    xhr.status === 200 ? resolve() : reject("HTTP " + xhr.status));
                xhr.addEventListener("error", () => reject("rețea"));

                xhr.open("POST", "api/upload");
                xhr.send(fd);
            });
        }

        // ---------------- lista de fișiere ----------------

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + " B";
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
            if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + " MB";
            return (bytes / 1024 / 1024 / 1024).toFixed(2) + " GB";
        }

        function formatDate(utc) {
            const d = new Date(utc); // UTC pe sârmă, local la afișare
            return d.toLocaleDateString("ro-RO", { day: "numeric", month: "short" });
        }

        async function loadFiles() {
            const response = await fetch("api/files");
            if (!response.ok) return;
            const files = await response.json();

            list.innerHTML = "";
            empty.hidden = files.length > 0;

            for (const f of files) {
                const li = document.createElement("li");

                const ico = document.createElement("span");
                ico.className = "file-ico";
                const dot = f.name.lastIndexOf(".");
                ico.textContent = dot > 0 ? f.name.slice(dot + 1, dot + 5) : "?";

                const info = document.createElement("div");
                info.className = "info";

                const a = document.createElement("a");
                a.className = "name";
                a.href = "api/files/" + f.id + "/download";
                a.textContent = f.name;

                const meta = document.createElement("div");
                meta.className = "meta";
                meta.textContent = formatSize(f.sizeBytes) + " · " + formatDate(f.modifiedUtc);

                info.appendChild(a);
                info.appendChild(meta);

                const del = document.createElement("button");
                del.className = "icon-btn";
                del.textContent = "✕";
                del.title = "Șterge (Recycle Bin)";
                del.addEventListener("click", async () => {
                    if (!confirm("Ștergi \"" + f.name + "\" de pe PC? (ajunge în Recycle Bin)")) return;
                    const r = await fetch("api/files/" + f.id, { method: "DELETE" });
                    if (r.ok) loadFiles();
                });

                li.appendChild(ico);
                li.appendChild(info);
                li.appendChild(del);
                list.appendChild(li);
            }
        }

        refresh.addEventListener("click", loadFiles);
        loadFiles();

        // ---------------- comenzi PC ----------------

        const confirmText = {
            shutdown: "Sigur închizi PC-ul?",
            restart: "Sigur repornești PC-ul?",
            sleep: "PC-ul intră în sleep. Continui?",
            lock: null, // lock e inofensiv, fără confirmare
            abort: null
        };

        document.querySelectorAll(".power button").forEach(b => {
            b.addEventListener("click", async () => {
                const action = b.dataset.action;
                const q = confirmText[action];
                if (q && !confirm(q)) return;

                const r = await fetch("api/power/" + action, { method: "POST" });
                const data = await r.json().catch(() => null);
                powerMsg.textContent = r.ok ? (data?.message ?? "OK") : "Eroare: HTTP " + r.status;

                // la shutdown/restart ai 15 secunde de răzgândit
                abortBtn.hidden = !(action === "shutdown" || action === "restart");
            });
        });
    </script>
</body>
</html>
