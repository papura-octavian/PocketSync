<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PocketSync</title>
</head>
<body>
    <h1> PocketSync </h1>
    <input type="file" id="file" />
    <button id="send">Send</button>
    <div id="status"></div>
    <progress id="bar" value="0" max="100"> </progress>
    <h2>PC Files</h2>
    <button id="refresh">refresh</button>
    <ul id="list"></ul>
    <script>
        const btn = document.getElementById("send");
        const input = document.getElementById("file");
        const status = document.getElementById("status");
        const bar = document.getElementById("bar");

        btn.addEventListener("click", async () => {
            const file = input.files[0];

            if (!file) {
                status.textContent = "Choose a file First";
                return;
            }

            status.textContent = "Sending...";

            const fd = new FormData();

            fd.append("file", file);

            const xhr = new XMLHttpRequest();

            xhr.upload.addEventListener("progress", (e) => {
                bar.value = (e.loaded / e.total) * 100;
                const seconds= (Date.now() - start) / 1000;
                const mbps = (e.loaded / 1024 / 1024) / seconds;
                status.textContent = "Sending... " + mbps.toFixed(1) + " MB/s";
            });

            xhr.addEventListener("load", () => {
                if (xhr.status === 200) {
                    status.textContent = "Done : " + file.name;
                } else {
                    status.textContent = "Error : " + xhr.status;
                }
            });

            xhr.open("POST", "api/upload");

            const start = Date.now();

            xhr.send(fd);
        });

        const list = document.getElementById("list");
        const refresh = document.getElementById("refresh");

        async function loadFiles() {
            const response = await fetch("api/files");
            const files = await response.json();

            list.innerHTML = "";

            for (const f of files) {
                const li = document.createElement("li");
                const a = document.createElement("a");
                a.href = "api/files/" + f.id + "/download";
                a.textContent = f.name;
                li.appendChild(a);
                li.appendChild(document.createTextNode("  —  " + formatSize(f.sizeBytes)));
                list.appendChild(li);
            }
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + " B";
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
            if (bytes < 1024 * 1024 * 1024) return (bytes / 1024 / 1024).toFixed(1) + " MB";
            return (bytes / 1024 / 1024 / 1024).toFixed(2) + " GB";
        }

        refresh.addEventListener("click", loadFiles);
        loadFiles();

    </script> 
</body>
</html>
